<style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#ddd;font:14px Georgia,'Microsoft YaHei',serif}body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}#player{position:relative;width:min(100vw,calc((100vh - 65px)*16/9));aspect-ratio:16/9;background:#000}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#191919;font-size:18px}#errors{display:none;position:absolute;inset:12%;padding:24px;background:#321e1e;white-space:pre-wrap;overflow:auto}footer{padding:12px;text-align:center;line-height:1.7}a,button{color:#ddd}button{background:transparent;border:1px solid #999;padding:5px 12px;cursor:pointer}#player:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;display:flex;align-items:center;justify-content:center}#player:fullscreen canvas{width:min(100vw,177.777vh);height:min(100vh,56.25vw)}small{opacity:.8}</style></head>
<body><main id="player"><canvas id="unity-canvas" width="1920" height="1080" tabindex="0" aria-label="Mirror Trip game"></canvas><div id="loading">正在加载 / Loading… <span id="progress">0%</span></div><div id="errors" role="alert"></div></main>

<script>
const canvas=document.getElementById('unity-canvas'),config={"dataUrl": "Build/9bfbb1d6a72772d04e5109a34b1d0c5a.data.unityweb", "frameworkUrl": "Build/464fc2484017648b1ab0cc1ca5ac0908.framework.js.unityweb", "codeUrl": "Build/dc627caf2ca0e954f570e8110bcac16a.wasm.unityweb", "streamingAssetsUrl": "StreamingAssets", "companyName": "Rong Shen (Singlong404)", "productName": "Mirror Trip", "productVersion": "1.0.0", "matchWebGLToCanvasSize": false, "devicePixelRatio": 1, "autoSyncPersistentDataPath": true};
config.showBanner=(message,type)=>{if(type==='error'){const e=document.getElementById('errors');e.style.display='block';e.textContent=message;}else console.warn(message);};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const loader=document.createElement('script');loader.src="Build/6d3ee04ae67fe18bed2ba693e2976675.loader.js";
loader.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('progress').textContent=Math.round(p*100)+'%';}).then(instance=>{window.unityInstance=instance;window.mirrorTripReady=true;document.getElementById('loading').style.display='none';canvas.focus();}).catch(e=>config.showBanner(String(e),'error'));
loader.onerror=()=>config.showBanner('加载失败，请检查网络后刷新。 / Failed to load. Please refresh.','error');document.body.appendChild(loader);
document.getElementById('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('player').requestFullscreen().then(()=>canvas.focus());};
</script></body></html>
